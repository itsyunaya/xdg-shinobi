[package]
name = "xdg-shinobi"
version = "0.1.1"
edition = "2024"

[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
panic = "abort"

[dependencies]
clap = { version = "4.6.6", features = ["std", "derive"], default-features = false }
crossterm = { version = "0.29.0", default-features = false }
pulldown-cmark = "0.12"
pulldown-cmark-mdcat = { version = "=2.14.0", default-features = false }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
